# Default values for Zipline on Kubernetes with Crucible compute.
# Terraform maps cloud-specific infrastructure into these cloud-neutral values.

global:
  customer_name: ""
  artifact_prefix: ""
  version: "latest"
  deploy_fetcher: false

runtime:
  env: []

secrets:
  externalSecrets:
    enabled: false
    refreshInterval: 1h
    secretStore:
      create: false
      name: zipline-secret-store
      kind: SecretStore
      spec: {}
    targets: []

compute:
  defaultNamespace: zipline-default
  namespaceDefaults:
    labels: {}
    annotations: {}
    resourceQuota:
      enabled: true
      hard:
        requests.cpu: "200"
        requests.memory: "800Gi"
        limits.cpu: "400"
        limits.memory: "1600Gi"
        pods: "500"
    limitRange:
      enabled: true
      # Default LIMIT (ceiling) for containers that don't set their own — sized
      # for a fat Spark executor's node so executors can burst above their
      # request (request stays the guaranteed floor). Raise if using larger
      # executor instance sizes. Small pods are unaffected (they request 500m).
      default:
        cpu: "16"
        memory: "64Gi"
      defaultRequest:
        cpu: "500m"
        memory: "1Gi"
  namespaces:
    - name: zipline-default
      team: default
      labels: {}
      annotations: {}
  objectStore:
    bucket: ""      # Bucket/container name only, no URI scheme.
    region: ""
  serviceAccount:
    sparkName: spark-operator-spark
    flinkName: flink
    annotations: {}
  rbac:
    create: true
  sparkDefaults:
    eventLogDir: ""
    image: "ziplineai/spark:nightly"
    imagePullPolicy: "Always"
    chrononJarPath: "/opt/chronon/chronon-spark.jar"
    spotNodeSelector: {}
  flinkDefaults:
    image: "ziplineai/flink:1.20.3"
    serviceAccount: flink
    serviceAccountAnnotations: {}
  systemPriorityClass:
    enabled: true
    name: "zipline-compute-system"
    value: 1000
  warmPool:
    enabled: false
    replicas: 2
    priorityClassName: "zipline-spark-pause"
    namespace: ""  # Defaults to release namespace.
    resources:
      cpu: "2"
      memory: "4Gi"
    taintKey: ""
    taintValue: "driver"
    nodeSelector: {}
    tolerations: []
    annotations: {}
  imagePrepull:
    enabled: false
    images: []
    nodeSelector: {}
    tolerations: []
  historyServer:
    image: "ziplineai/spark:nightly"
    proxyBase: "spark-history"
    daemonMemory: "5g"
    hybridStoreMemory: "4g"
    maxDiskUsage: "50g"
    cleanerMaxAge: "3d"
    retainedApplications: 50
    extraSparkHistoryOpts: []
    resources:
      requests:
        cpu: "2"
        memory: "6Gi"
      limits:
        memory: "8Gi"
    nodeSelector: {}
    tolerations: []
    persistence:
      enabled: true
      storageClass: ""
      size: 10Gi
  loki:
    image: "grafana/loki:3.4.2"
    retention: "168h"
    objectStore: filesystem
    deleteRequestStore: filesystem
    commonStorage:
      filesystem:
        chunks_directory: /loki/chunks
        rules_directory: /loki/rules
    storageConfig: {}
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        memory: 1Gi
    nodeSelector: {}
    tolerations: []
    storage:
      enabled: true
      storageClass: ""
      size: 10Gi

# Database configuration. jdbcUrl wins when set; otherwise templates build a
# Postgres JDBC URL from host/port/name/sslMode.
database:
  jdbcUrl: ""
  url: ""
  host: ""
  port: 5432
  name: "execution_info"
  sslMode: ""
  credentialsSecret:
    name: db-credentials
    usernameKey: username
    passwordKey: password

polaris:
  # Polaris is part of the in-cluster compute stack.
  # Defaults to global.customer_name.
  realm: ""
  image:
    repository: "apache/polaris"
    tag: "1.5.0"
    pullPolicy: IfNotPresent
  # Polaris images are public; don't inherit the Zipline private image pull secret.
  imagePullSecrets: []
  replicas: 1
  ports:
    http: 8181
    management: 8182
  database:
    # Separate database on the same Postgres instance as database.name.
    name: "polaris_catalog"
    adminDatabase: "postgres"
    jdbcParams: ""
    psqlParams: ""
    create: true
    initImage: "postgres:16-alpine"
    # Defaults to database.credentialsSecret when unset.
    credentialsSecret: {}
  service:
    type: ClusterIP
  managementService:
    type: ClusterIP
    clusterIP: None
  realmContext:
    requireHeader: false
  bootstrap:
    backoffLimit: 6
    activeDeadlineSeconds: 900
    image:
      repository: "apache/polaris-admin-tool"
      tag: "1.5.0"
      pullPolicy: IfNotPresent
    credentialsSecret:
      # Secret data must contain one line formatted as:
      # <realm>,<client-id>,<client-secret>
      name: "polaris-bootstrap-credentials"
      key: "credentials"
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "1"
        memory: "1Gi"
    rbac:
      image:
        repository: "python"
        tag: "3.12-alpine"
        pullPolicy: IfNotPresent
      catalog:
        # Defaults to polaris_<realm>. The chart seeds this default customer
        # catalog/namespace; Hub reconciles team/namespace RBAC.
        name: ""
        # Defaults to <compute.objectStore.bucket>/polaris/<catalog-name>/.
        defaultBaseLocation: ""
        storage:
          type: ""
          # Defaults to the catalog defaultBaseLocation.
          allowedLocations: []
          # Provider-specific Polaris storageConfigInfo fields. Terraform should
          # pass cloud-specific keys here without the chart branching on them.
          config: {}
      # Bootstrap grants this catalog role to the principal role. service_admin is
      # assigned to the bootstrapped root principal by Polaris.
      principalRole: "service_admin"
      catalogRole: "polaris-engine"
      catalogGrants:
        - CATALOG_MANAGE_CONTENT
      namespaces:
        - name: "default"
          create: true
          grants:
            - NAMESPACE_FULL_METADATA
            - TABLE_CREATE
            - TABLE_FULL_METADATA
            - TABLE_READ_DATA
            - TABLE_WRITE_DATA
    runtimeClient:
      # Creates a non-root Polaris principal for Spark/Iceberg clients and
      # writes client_id:client_secret to a Kubernetes Secret for Hub.
      principal: "chronon"
      principalRole: "chronon-engine"
      # Defaults to polaris.bootstrap.rbac.catalogRole when unset.
      catalogRole: ""
      credentialsSecret:
        name: "polaris-client-credentials"
        key: "OC_CREDENTIAL"
  extraConfig: {}
  extraEnv: []
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# StarRocks is the query engine behind the Data Explorer. It is always
# deployed and is initialized against the Polaris Iceberg REST catalog below.
# Polaris vends the storage credentials, keeping this configuration independent
# of the cloud object-store provider.
starrocks:
  # Installed through the official StarRocks Kubernetes Operator Helm chart.
  # The chart version pins the operator and default StarRocks 4.1 image.
  chartVersion: "1.11.6"
  clusterName: "starrocks"
  feImage:
    repository: "starrocks/fe-ubuntu"
    tag: "4.1.3"
  beImage:
    repository: "starrocks/be-ubuntu"
    tag: "4.1.3"
  mysqlImage: "mysql:8.0"
  ports:
    mysql: 9030
  persistence:
    storageClass: ""
    feSize: 10Gi
    feLogSize: 5Gi
    beSize: 100Gi
    beLogSize: 5Gi
  feResources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "4"
      memory: "8Gi"
  beResources:
    requests:
      cpu: "4"
      memory: "16Gi"
    limits:
      cpu: "8"
      memory: "32Gi"
  nodeSelector: {}
  tolerations: []

# Service account configuration. Cloud identity should be supplied as
# annotations and pod labels by the cloud-specific Terraform values.
serviceAccount:
  create: true
  name: orchestration-sa
  annotations: {}

podLabels: {}

# Domain configuration
domains:
  ziplineUI: ""  # If empty, accessible via load balancer DNS
  hub: ""        # If empty, accessible via load balancer DNS

# Orchestration services configuration
orchestration:
  hub:
    image: ""
    verticleClass: ""
    replicas: 1
    port: 3903
    metricsReader: prometheus
    metricsPort: 8905
    podAnnotations: {}
    env: []
    nodeSelector: {}
    tolerations: []
    resources:
      limits:
        cpu: "6"
        memory: "28Gi"
      requests:
        cpu: "2"
        memory: "8Gi"

  ui:
    image: "ziplineai/web-ui"
    replicas: 1
    port: 3000
    origin: ""
    env: []
    nodeSelector: {}
    tolerations: []
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"
      requests:
        cpu: "250m"
        memory: "256Mi"

  fetcher:
    image: "ziplineai/chronon-fetcher"
    replicas: 3
    port: 9000
    env: []
    nodeSelector: {}
    tolerations: []
    resources:
      limits:
        cpu: "8"
        memory: "32Gi"
      requests:
        cpu: "8"
        memory: "32Gi"

  eval:
    image: ""
    replicas: 1
    port: 3904
    env: []
    nodeSelector: {}
    tolerations: []
    resources:
      requests:
        cpu: "500m"
        memory: "4Gi"
      limits:
        cpu: "2"
        memory: "8Gi"

# Shared Ingress NGINX controller for all Zipline routes
ingress-nginx-ui:
  enabled: true
  controller:
    ingressClassResource:
      name: nginx-ui
      enabled: true
      default: false
      controllerValue: "k8s.io/ingress-nginx-ui"
    ingressClass: nginx-ui
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    service:
      annotations: {}
    admissionWebhooks:
      enabled: false
    electionID: ingress-controller-leader-ui
    namespaceOverride: ingress-nginx-ui

# Ingress configuration
ingress:
  ui:
    className: nginx-ui
    host: ""
    path: "/"
    tls: []
    annotations: {}
  hub:
    className: nginx-ui
    host: ""
    externalUrl: ""  # Override HUB_BASE_URL directly when a custom load balancer or proxy sits in front of nginx.
    path: "/services/hub"
    tls: []
    annotations:
      nginx.ingress.kubernetes.io/health-check-path: "/ping"
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"
      # Match the hub server's 300s idle timeout (OrchestrationVerticle). A large
      # first-time /upload/v2/confs — the full config set to an empty hub — spends
      # tens of seconds in json-decode + diff + S3 write and runs past nginx's
      # default 60s, so nginx returns 504 before the hub finishes. Incremental
      # diffs on a warm hub stay well under, which is why this only bites fresh
      # deploys (e.g. the nightly up/down test).
      nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      nginx.ingress.kubernetes.io/use-regex: "true"
    # nginx auth_request forward-auth for browser traffic on Hub routes
    # (e.g. live SparkUI under /services/hub/api/v1/.../ui). Browser requests
    # are gated via a subrequest to the UI's `/auth/forward` endpoint, which
    # mints a JWT from the better-auth session cookie. nginx propagates that
    # JWT to Hub as `Authorization: Bearer …`, matching what the UI sends on
    # internal API calls. CLI / curl traffic with an existing Authorization
    # header bypasses (the forward endpoint echoes the header through).
    # cacheKey MUST include `$http_authorization` so anon (no cookie) and
    # Bearer (with cookie empty) requests don't share a key — otherwise a
    # cached Bearer-200 from /forward would let anon traffic skip auth.
    browserAuth:
      forwardUrl: "http://orchestration-ui-service.zipline-system.svc.cluster.local/auth/forward"
      signinUrl: "https://$host/auth/login?redirect=$escaped_request_uri"
      cacheKey: "$http_authorization|$cookie_better_auth_session_token"
      cacheDuration: "200 60s"
  fetcher:
    className: nginx-ui
    host: ""
    path: "/services/fetcher"
    tls: []
    annotations:
      nginx.ingress.kubernetes.io/health-check-path: "/ping"
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      nginx.ingress.kubernetes.io/use-regex: "true"
  eval:
    className: nginx-ui
    host: ""
    path: "/services/eval"
    tls: []
    annotations:
      nginx.ingress.kubernetes.io/rewrite-target: "/$2"
      nginx.ingress.kubernetes.io/use-regex: "true"
  polaris:
    className: nginx-ui
    path: "/services/catalog"
    pathType: ImplementationSpecific
    tls: []
    annotations:
      nginx.ingress.kubernetes.io/use-regex: "true"
      nginx.ingress.kubernetes.io/rewrite-target: "/api/catalog/$2"
      nginx.ingress.kubernetes.io/proxy-body-size: "20m"

# Image pull secrets for Docker Hub
imagePullSecrets:
  - name: docker-hub-creds

# Prometheus configuration
prometheus:
  queryEndpoint: ""
  namespace: "zipline-system"

spark-operator:
  enabled: true
  controller:
    replicas: 2
    workers: 20
    kubeAPIQPS: 100
    kubeAPIBurst: 200
  spark:
    jobNamespaces: []
    jobNamespaceSelector: zipline.ai/namespace-type=compute
    serviceAccount:
      create: false
      name: spark-operator-spark
    rbac:
      create: false

promtail:
  enabled: true
  config:
    clients: []
    snippets:
      pipelineStages:
        - cri: {}
        - json:
            expressions:
              workflowId: workflowId
              stepId: stepId
        - structured_metadata:
            workflowId:
            stepId:
      extraRelabelConfigs:
        - source_labels: [__meta_kubernetes_namespace]
          action: drop
          regex: kube-system|kube-public|kube-node-lease|cert-manager|default
        - source_labels: [__meta_kubernetes_pod_label_chronon_job_id]
          action: replace
          target_label: chronon_job_id
        - source_labels: [__meta_kubernetes_pod_label_spark_role]
          action: replace
          target_label: spark_role
  tolerations:
    - operator: Exists
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi

auth:
  enabled: false
  url: ""
  google_oauth_client_id: ""
  google_oauth_client_secret: ""
  github_oauth_client_id: ""
  github_oauth_client_secret: ""
  microsoft_entra_tenant_id: ""
  microsoft_entra_oauth_client_id: ""
  microsoft_entra_oauth_client_secret: ""
  sso_provider_id: ""
  sso_domain: ""
  sso_issuer: ""
  sso_client_id: ""
  sso_client_secret: ""
  sso_use_saml: false
  sso_saml_entry_point: ""
  sso_saml_issuer: ""
  sso_saml_callback_url: ""
  idp_role_mapping: ""
  idp_group_claim: ""

certManager:
  enabled: true
  installCRDs: true

clusterIssuer:
  enabled: false
  name: "letsencrypt-prod"
  email: ""
  server: "https://acme-v02.api.letsencrypt.org/directory"
  privateKeySecretName: ""
  ingressClass: ""
