{{- if .Values.compute.sparkDefaults.nvmeEnabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "zipline-orchestration.fullname" . }}-nvme-setup
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
    app.kubernetes.io/component: nvme-setup
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "zipline-orchestration.name" . }}-nvme-setup
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "zipline-orchestration.name" . }}-nvme-setup
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "zipline-orchestration.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      tolerations:
        - operator: Exists
      initContainers:
        - name: nvme-setup
          image: {{ required "compute.sparkDefaults.nvmeSetupImage is required when compute.sparkDefaults.nvmeEnabled=true" .Values.compute.sparkDefaults.nvmeSetupImage }}
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              found_nvme=false

              mount_nvme() {
                dev="$1"
                real_dev="$(echo "$dev" | sed 's|/host-dev/|/dev/|')"

                # Check the HOST mount table (/proc/1/mounts), not /proc/mounts —
                # the latter resolves via /proc/self to the container's mount ns
                # and never sees the host-ns mount, so the re-run would try to
                # mount again and fail ("already mounted"), crashing under set -e.
                if grep -q " /mnt/nvme " /host-proc/1/mounts 2>/dev/null; then
                  echo "$real_dev already mounted at /mnt/nvme"
                  return 0
                fi

                mkfs.ext4 -F "$dev" 2>/dev/null || true
                mkdir -p /host-mnt/nvme

                if command -v nsenter >/dev/null 2>&1; then
                  nsenter --mount=/host-proc/1/ns/mnt -- /usr/bin/mkdir -p /mnt/nvme
                  nsenter --mount=/host-proc/1/ns/mnt -- /usr/bin/mount "$real_dev" /mnt/nvme
                  nsenter --mount=/host-proc/1/ns/mnt -- /usr/bin/chmod 1777 /mnt/nvme
                else
                  mount "$dev" /host-mnt/nvme
                  chmod 1777 /host-mnt/nvme
                fi

                echo "Mounted $real_dev at /mnt/nvme"
              }

              if command -v nvme >/dev/null 2>&1; then
                for dev in /host-dev/nvme*n1; do
                  [ -b "$dev" ] || continue
                  model="$(nvme id-ctrl "$dev" -o json 2>/dev/null | grep -o '"mn" *: *"[^"]*"' | head -1 | sed 's/.*: *"//;s/".*//' | xargs 2>/dev/null || true)"
                  if echo "$model" | grep -qi "Instance Storage"; then
                    mount_nvme "$dev"
                    found_nvme=true
                    break
                  fi
                done
              fi

              if [ "$found_nvme" = "false" ]; then
                for dev in /host-dev/nvme*n1; do
                  [ -b "$dev" ] || continue
                  devname="$(basename "$dev")"
                  model="$(cat "/host-sys/block/$devname/device/model" 2>/dev/null | xargs 2>/dev/null || true)"
                  if echo "$model" | grep -qi "Instance\|NVMe SSD\|Local"; then
                    mount_nvme "$dev"
                    found_nvme=true
                    break
                  fi
                done
              fi

              if [ "$found_nvme" = "false" ]; then
                echo "No NVMe instance store on this node, skipping"
                exit 0
              fi

              token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              ca=/var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              api="https://kubernetes.default.svc"

              # Add the nvme label + taint (strategic-merge ADD works fine).
              curl -fsS --cacert "$ca" -H "Authorization: Bearer $token" \
                -H "Content-Type: application/strategic-merge-patch+json" \
                -X PATCH "$api/api/v1/nodes/$NODE_NAME" \
                -d '{"metadata":{"labels":{"zipline.ai/nvme":"true"}},"spec":{"taints":[{"key":"zipline.ai/nvme","value":"true","effect":"NoSchedule"}]}}' >/dev/null 2>&1 || true

              # Remove the zipline.ai/nvme-setup startup taint. A strategic-merge
              # $patch:delete ERRORS and does not remove node taints here, so use a
              # JSON Patch remove-by-index (verified via server dry-run). The `test`
              # op guards against the index shifting between read and patch; retry a
              # few times for API races.
              n=0
              while [ "$n" -lt 10 ]; do
                n=$((n + 1))
                idx="$(curl -fsS --cacert "$ca" -H "Authorization: Bearer $token" \
                  "$api/api/v1/nodes/$NODE_NAME" 2>/dev/null \
                  | python3 -c 'import json,sys;ts=json.load(sys.stdin)["spec"].get("taints",[]);print(next((i for i,t in enumerate(ts) if t["key"]=="zipline.ai/nvme-setup"),-1))' 2>/dev/null || echo -1)"
                if [ "$idx" = "-1" ]; then
                  echo "NVMe ready on $NODE_NAME (startup taint cleared)"
                  break
                fi
                curl -fsS --cacert "$ca" -H "Authorization: Bearer $token" \
                  -H "Content-Type: application/json-patch+json" \
                  -X PATCH "$api/api/v1/nodes/$NODE_NAME" \
                  -d "[{\"op\":\"test\",\"path\":\"/spec/taints/$idx/key\",\"value\":\"zipline.ai/nvme-setup\"},{\"op\":\"remove\",\"path\":\"/spec/taints/$idx\"}]" >/dev/null 2>&1 || true
                sleep 1
              done
          volumeMounts:
            - name: host-dev
              mountPath: /host-dev
            - name: host-mnt
              mountPath: /host-mnt
              mountPropagation: Bidirectional
            - name: host-proc
              mountPath: /host-proc
              readOnly: true
            - name: host-sys
              mountPath: /host-sys
              readOnly: true
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: "10m"
              memory: "16Mi"
            limits:
              cpu: "10m"
              memory: "16Mi"
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
        - name: host-mnt
          hostPath:
            path: /mnt
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-sys
          hostPath:
            path: /sys
{{- end }}
