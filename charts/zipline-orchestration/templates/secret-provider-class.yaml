{{- if .Values.secrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "zipline-orchestration.secretProviderClassName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  provider: {{ required "secrets.provider is required when secrets.enabled=true" .Values.secrets.provider }}
  {{- with .Values.secrets.secretObjects }}
  secretObjects:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.secrets.parameters }}
  parameters:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
