apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipline-orchestration-hub
  namespace: {{ .Release.Namespace }}
  labels:
    app: orchestration-hub
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.orchestration.hub.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: orchestration-hub
  template:
    metadata:
      {{- with .Values.orchestration.hub.podAnnotations }}
      annotations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: orchestration-hub
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "zipline-orchestration.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestration.hub.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestration.hub.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestration-hub
          image: "{{ required "orchestration.hub.image is required" .Values.orchestration.hub.image }}:{{ .Values.global.version }}"
          imagePullPolicy: Always
          env:
            - name: VERTICLE_CLASS
              value: {{ required "orchestration.hub.verticleClass is required" .Values.orchestration.hub.verticleClass | quote }}
            - name: DB_URL
              value: {{ include "zipline-orchestration.databaseJdbcUrl" . | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "zipline-orchestration.databaseCredentialsSecretName" . }}
                  key: {{ include "zipline-orchestration.databaseCredentialsUsernameKey" . }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zipline-orchestration.databaseCredentialsSecretName" . }}
                  key: {{ include "zipline-orchestration.databaseCredentialsPasswordKey" . }}
            - name: CUSTOMER_ID
              value: {{ .Values.global.customer_name | quote }}
            - name: ARTIFACT_PREFIX
              value: {{ .Values.global.artifact_prefix | quote }}
            - name: ORCHESTRATION_PORT
              value: "{{ .Values.orchestration.hub.port }}"
            - name: HUB_FRONTEND_URL
              value: "http://orchestration-ui-service/"
            {{- if .Values.ingress.hub.externalUrl }}
            - name: HUB_BASE_URL
              value: {{ .Values.ingress.hub.externalUrl | quote }}
            {{- else if .Values.ingress.hub.host }}
            - name: HUB_BASE_URL
              value: "https://{{ .Values.ingress.hub.host }}{{ if ne (.Values.ingress.hub.path | default "/") "/" }}{{ .Values.ingress.hub.path }}{{ end }}"
            {{- end }}
            - name: IN_CLUSTER_COMPUTE_ENABLED
              value: "true"
            - name: CRUCIBLE_DEFAULT_NAMESPACE
              value: {{ include "zipline-orchestration.computeJobNamespace" . | quote }}
            - name: CRUCIBLE_SPARK_IMAGE
              value: "{{ .Values.compute.sparkDefaults.image }}"
            - name: CRUCIBLE_SPARK_SERVICE_ACCOUNT
              value: "{{ .Values.compute.serviceAccount.sparkName }}"
            {{- $historyServerPublicUrl := include "zipline-orchestration.historyServerPublicUrl" . }}
            {{- if $historyServerPublicUrl }}
            - name: CRUCIBLE_SPARK_HISTORY_PUBLIC_URL
              value: {{ $historyServerPublicUrl | quote }}
            {{- end }}
            - name: CRUCIBLE_SPARK_EVENT_LOG_DIR
              value: {{ include "zipline-orchestration.sparkEventLogDir" . | quote }}
            - name: LOKI_URL
              value: "http://{{ include "zipline-orchestration.fullname" . }}-loki.{{ include "zipline-orchestration.computeSystemNamespace" . }}.svc.cluster.local:3100"
            - name: CRUCIBLE_DRIVER_PRIORITY_CLASS
              value: "{{ .Values.compute.driverPriorityClass.name }}"
            - name: CRUCIBLE_FLINK_IMAGE
              value: "{{ .Values.compute.flinkDefaults.image }}"
            - name: CRUCIBLE_FLINK_SERVICE_ACCOUNT
              value: "{{ .Values.compute.flinkDefaults.serviceAccount | default "flink" }}"
            - name: AUTH_ENABLED
              value: "{{ .Values.auth.enabled }}"
            - name: AUTH_JWKS_URL
              value: "http://orchestration-ui-service/api/auth/jwks"
            {{- $configuredEnvNames := list }}
            {{- $configuredMetricsReader := "" }}
            {{- range .Values.runtime.env }}
            {{- $configuredEnvNames = append $configuredEnvNames .name }}
            {{- if eq .name "CHRONON_METRICS_READER" }}
            {{- $configuredMetricsReader = .value | default "" }}
            {{- end }}
            {{- end }}
            {{- range .Values.orchestration.hub.env }}
            {{- $configuredEnvNames = append $configuredEnvNames .name }}
            {{- if eq .name "CHRONON_METRICS_READER" }}
            {{- $configuredMetricsReader = .value | default "" }}
            {{- end }}
            {{- end }}
            {{- $hasMetricsReaderEnv := has "CHRONON_METRICS_READER" $configuredEnvNames }}
            {{- $metricsReader := .Values.orchestration.hub.metricsReader | default "" }}
            {{- $effectiveMetricsReader := $metricsReader }}
            {{- if $hasMetricsReaderEnv }}
            {{- $effectiveMetricsReader = $configuredMetricsReader }}
            {{- end }}
            {{- if and $metricsReader (not $hasMetricsReaderEnv) }}
            - name: CHRONON_METRICS_READER
              value: {{ $metricsReader | quote }}
            {{- end }}
            {{- if and (eq $effectiveMetricsReader "prometheus") .Values.orchestration.hub.metricsPort (not (has "CHRONON_PROMETHEUS_SERVER_PORT" $configuredEnvNames)) }}
            - name: CHRONON_PROMETHEUS_SERVER_PORT
              value: {{ .Values.orchestration.hub.metricsPort | quote }}
            {{- end }}
            {{- with .Values.runtime.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.orchestration.hub.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: {{ .Values.orchestration.hub.port }}
            {{- if and (eq $effectiveMetricsReader "prometheus") .Values.orchestration.hub.metricsPort }}
            - name: metrics
              containerPort: {{ .Values.orchestration.hub.metricsPort }}
              protocol: TCP
            {{- end }}
          resources:
          {{- toYaml .Values.orchestration.hub.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.orchestration.hub.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: {{ .Values.orchestration.hub.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration-hub-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  selector:
    app: orchestration-hub
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.orchestration.hub.port }}
      protocol: TCP
  type: ClusterIP
