{{- $starrocks := .Values.starrocks }}
{{- $runtimeClient := default dict .Values.polaris.bootstrap.runtimeClient }}
{{- $credentialSecret := default dict $runtimeClient.credentialsSecret }}
{{- $credentialSecretName := default "polaris-client-credentials" $credentialSecret.name }}
{{- $credentialSecretKey := default "OC_CREDENTIAL" $credentialSecret.key }}
{{- $realm := default .Values.global.customer_name .Values.polaris.realm }}
{{- if eq $realm "" }}
{{- fail "global.customer_name or polaris.realm is required for the StarRocks Polaris catalog" }}
{{- end }}
{{- $catalogName := printf "polaris_%s" $realm }}
{{- $principalRole := default "chronon-engine" $runtimeClient.principalRole }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: starrocks-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: starrocks
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
data:
  fe.conf: |
    LOG_DIR = ${STARROCKS_HOME}/log
    DATE = "$(date +%Y%m%d-%H%M%S)"
    JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx4096m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
    http_port = {{ $starrocks.ports.feHttp }}
    rpc_port = 9020
    query_port = {{ $starrocks.ports.mysql }}
    edit_log_port = 9010
    mysql_service_nio_enabled = true
    sys_log_level = INFO
  be.conf: |
    LOG_DIR = ${STARROCKS_HOME}/log
    sys_log_level = INFO
    be_port = 9060
    webserver_port = {{ $starrocks.ports.beHttp }}
    heartbeat_service_port = 9050
    brpc_port = 8060
    storage_root_path = ${STARROCKS_HOME}/storage
    mem_limit = 70%
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: starrocks-data
  namespace: {{ .Release.Namespace }}
  labels:
    app: starrocks
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $starrocks.persistence.storageClass }}
  storageClassName: {{ $starrocks.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $starrocks.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: starrocks
  namespace: {{ .Release.Namespace }}
  labels:
    app: starrocks
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: starrocks
  template:
    metadata:
      labels:
        app: starrocks
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "zipline-orchestration.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $starrocks.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $starrocks.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: starrocks
          image: {{ $starrocks.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: STARROCKS_HOME
              value: /opt/starrocks
          ports:
            - name: mysql
              containerPort: {{ $starrocks.ports.mysql }}
            - name: fe-http
              containerPort: {{ $starrocks.ports.feHttp }}
            - name: be-http
              containerPort: {{ $starrocks.ports.beHttp }}
          volumeMounts:
            - name: data
              mountPath: /opt/starrocks/fe/meta
              subPath: fe-meta
            - name: data
              mountPath: /opt/starrocks/be/storage
              subPath: be-storage
            - name: config
              mountPath: /opt/starrocks/fe/conf/fe.conf
              subPath: fe.conf
            - name: config
              mountPath: /opt/starrocks/be/conf/be.conf
              subPath: be.conf
          resources:
            {{- toYaml $starrocks.resources | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: mysql
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: starrocks-data
        - name: config
          configMap:
            name: starrocks-config
---
apiVersion: v1
kind: Service
metadata:
  name: starrocks-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: starrocks
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: starrocks
  ports:
    - name: mysql
      port: {{ $starrocks.ports.mysql }}
      targetPort: mysql
    - name: fe-http
      port: {{ $starrocks.ports.feHttp }}
      targetPort: fe-http
    - name: be-http
      port: {{ $starrocks.ports.beHttp }}
      targetPort: be-http
---
# Polaris creates the runtime credential in a post-install/post-upgrade hook.
# Run after it so StarRocks always receives the current credential.
apiVersion: batch/v1
kind: Job
metadata:
  name: starrocks-catalog-init
  namespace: {{ .Release.Namespace }}
  labels:
    app: starrocks
    app.kubernetes.io/component: catalog-init
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: starrocks
        app.kubernetes.io/component: catalog-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "zipline-orchestration.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-starrocks
          image: {{ $starrocks.mysqlImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 120); do
                if mysql -h starrocks-service -P {{ $starrocks.ports.mysql }} -u root -e 'SELECT 1' >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 3
              done
              echo 'Timed out waiting for StarRocks to accept queries' >&2
              exit 1
      containers:
        - name: initialize-catalog
          image: {{ $starrocks.mysqlImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              credential="$(cat /catalog-credential/{{ $credentialSecretKey }})"
              escaped_credential="$(printf '%s' "$credential" | sed 's/\\/\\\\/g; s/"/\\"/g')"
              cat <<SQL | mysql -h starrocks-service -P {{ $starrocks.ports.mysql }} -u root
              DROP CATALOG IF EXISTS {{ $catalogName }};
              CREATE EXTERNAL CATALOG {{ $catalogName }}
              PROPERTIES (
                "type" = "iceberg",
                "iceberg.catalog.type" = "rest",
                "iceberg.catalog.uri" = "http://polaris-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.polaris.ports.http }}/api/catalog",
                "iceberg.catalog.rest.nested-namespace-enabled" = "true",
                "iceberg.catalog.security" = "oauth2",
                "iceberg.catalog.oauth2.credential" = "${escaped_credential}",
                "iceberg.catalog.oauth2.scope" = "PRINCIPAL_ROLE:{{ $principalRole }}",
                "iceberg.catalog.warehouse" = "{{ $catalogName }}",
                "iceberg.catalog.vended-credentials-enabled" = "true",
                "iceberg.catalog.header.X-Iceberg-Access-Delegation" = "vended-credentials"
              );
              SQL
              mysql -h starrocks-service -P {{ $starrocks.ports.mysql }} -u root -e 'SHOW CATALOGS;'
          volumeMounts:
            - name: catalog-credential
              mountPath: /catalog-credential
              readOnly: true
      volumes:
        - name: catalog-credential
          secret:
            secretName: {{ $credentialSecretName }}
