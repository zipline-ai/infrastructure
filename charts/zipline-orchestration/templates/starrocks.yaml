{{- $starrocks := .Values.starrocks }}
{{- $runtimeClient := default dict .Values.polaris.bootstrap.runtimeClient }}
{{- $credentialSecret := default dict $runtimeClient.credentialsSecret }}
{{- $credentialSecretName := default "polaris-client-credentials" $credentialSecret.name }}
{{- $credentialSecretKey := default "OC_CREDENTIAL" $credentialSecret.key }}
{{- $realm := default .Values.global.customer_name .Values.polaris.realm }}
{{- if eq $realm "" }}
{{- fail "global.customer_name or polaris.realm is required for the StarRocks Polaris catalog" }}
{{- end }}
{{- /* StarRocks catalog names are independent from Polaris warehouse names. */ -}}
{{- $catalogName := "zipline_catalog" }}
{{- $polarisCatalogName := printf "polaris_%s" $realm }}
{{- $principalRole := default "chronon-engine" $runtimeClient.principalRole }}
{{- /* The official operator exposes the FE query service as <cluster>-fe-service. */ -}}
{{- $feService := printf "%s-fe-service" $starrocks.clusterName }}
---
# The StarRocksCluster and its FE/BE services are installed by the official
# starrocks-kubernetes-operator Helm release in the Terraform module. Keep the
# Polaris catalog bootstrap in this chart, after that release becomes ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: starrocks-catalog-init
  namespace: {{ .Release.Namespace }}
  labels:
    app: starrocks
    app.kubernetes.io/component: catalog-init
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: starrocks
        app.kubernetes.io/component: catalog-init
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "zipline-orchestration.serviceAccountName" . }}
      initContainers:
        - name: wait-for-starrocks
          image: {{ $starrocks.mysqlImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              for attempt in $(seq 1 120); do
                if mysql -h {{ $feService }} -P {{ $starrocks.ports.mysql }} -u root -e 'SELECT 1' >/dev/null 2>&1; then
                  exit 0
                fi
                sleep 3
              done
              echo 'Timed out waiting for StarRocks to accept queries' >&2
              exit 1
      containers:
        - name: initialize-catalog
          image: {{ $starrocks.mysqlImage | quote }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              credential="$(cat /catalog-credential/{{ $credentialSecretKey }})"
              escaped_credential="$(printf '%s' "$credential" | sed 's/\\/\\\\/g; s/"/\\"/g')"
              cat <<SQL | mysql -h {{ $feService }} -P {{ $starrocks.ports.mysql }} -u root
              DROP CATALOG IF EXISTS {{ $polarisCatalogName }};
              DROP CATALOG IF EXISTS {{ $catalogName }};
              CREATE EXTERNAL CATALOG {{ $catalogName }}
              PROPERTIES (
                "type" = "iceberg",
                "iceberg.catalog.type" = "rest",
                "iceberg.catalog.uri" = "http://polaris-service.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.polaris.ports.http }}/api/catalog",
                "iceberg.catalog.rest.nested-namespace-enabled" = "true",
                "iceberg.catalog.security" = "oauth2",
                "iceberg.catalog.oauth2.credential" = "${escaped_credential}",
                "iceberg.catalog.oauth2.scope" = "PRINCIPAL_ROLE:{{ $principalRole }}",
                "iceberg.catalog.warehouse" = "{{ $polarisCatalogName }}",
                "iceberg.catalog.vended-credentials-enabled" = "true",
                "iceberg.catalog.header.X-Iceberg-Access-Delegation" = "vended-credentials"
              );
              SQL
              mysql -h {{ $feService }} -P {{ $starrocks.ports.mysql }} -u root -e 'SHOW CATALOGS;'
          volumeMounts:
            - name: catalog-credential
              mountPath: /catalog-credential
              readOnly: true
      volumes:
        - name: catalog-credential
          secret:
            secretName: {{ $credentialSecretName }}
