{{- if and (not .Values.ingress.hub.host) (not .Values.ingress.hub.externalUrl) }}
{{- $ingressControllerServiceName := include "zipline-orchestration.ingressNginxControllerServiceName" (dict "root" . "alias" "ingress-nginx-ui") }}
{{- $hubPath := default "/" (trimSuffix "/" (.Values.ingress.hub.path | default "/")) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: set-hub-base-url
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 1
  template:
    spec:
      serviceAccountName: {{ include "zipline-orchestration.serviceAccountName" . }}
      {{- with .Values.orchestration.hub.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.orchestration.hub.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Never
      containers:
      - name: set-hub-url
        image: alpine/k8s:1.28.3
        command:
        - /bin/sh
        - -c
        - |
          echo "Waiting for hub load balancer address..."
          attempt=1
          max_attempts=60
          while [ "$attempt" -le "$max_attempts" ]; do
            LOAD_BALANCER_ADDRESS=$(kubectl get svc {{ $ingressControllerServiceName }} -n {{ .Release.Namespace }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
            if [ -z "$LOAD_BALANCER_ADDRESS" ]; then
              LOAD_BALANCER_ADDRESS=$(kubectl get svc {{ $ingressControllerServiceName }} -n {{ .Release.Namespace }} -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            fi
            if [ -n "$LOAD_BALANCER_ADDRESS" ]; then
              break
            fi
            echo "Load balancer address not yet available (${attempt}/${max_attempts}), retrying in 10s..."
            attempt=$((attempt + 1))
            sleep 10
          done
          if [ -z "$LOAD_BALANCER_ADDRESS" ]; then
            echo "Timed out waiting for hub load balancer address" >&2
            exit 1
          fi
          echo "Load balancer address: $LOAD_BALANCER_ADDRESS"
          kubectl set env deployment/zipline-orchestration-hub HUB_BASE_URL=http://$LOAD_BALANCER_ADDRESS{{ if ne $hubPath "/" }}{{ $hubPath }}{{ end }} -n {{ .Release.Namespace }}
          kubectl patch ingress orchestration-hub-ingress -n {{ .Release.Namespace }} --type json -p "[{\"op\":\"replace\",\"path\":\"/spec/rules/0/host\",\"value\":\"$LOAD_BALANCER_ADDRESS\"}]" 2>/dev/null || kubectl patch ingress orchestration-hub-ingress -n {{ .Release.Namespace }} --type json -p "[{\"op\":\"add\",\"path\":\"/spec/rules/0/host\",\"value\":\"$LOAD_BALANCER_ADDRESS\"}]"
          # UI: replace the startup placeholder ORIGIN (uiOrigin helper) with the
          # real load-balancer URL, mirroring the hub. Without this the UI runs on
          # http://localhost:3000 and rejects cross-origin requests.
          kubectl set env deployment/zipline-orchestration-ui ORIGIN=http://$LOAD_BALANCER_ADDRESS -n {{ .Release.Namespace }}
          kubectl patch ingress orchestration-ui-ingress -n {{ .Release.Namespace }} --type json -p "[{\"op\":\"replace\",\"path\":\"/spec/rules/0/host\",\"value\":\"$LOAD_BALANCER_ADDRESS\"}]" 2>/dev/null || kubectl patch ingress orchestration-ui-ingress -n {{ .Release.Namespace }} --type json -p "[{\"op\":\"add\",\"path\":\"/spec/rules/0/host\",\"value\":\"$LOAD_BALANCER_ADDRESS\"}]"
          # Spark History Server ingress: patch its host to match the hub/UI host.
          # nginx-ingress groups rules by host into per-server blocks; a host-less
          # SHS rule lands in the default (_) server, but requests carry Host=<LB>
          # and are served by the <LB> block (hub + UI). There /spark-history has
          # no location and falls through to the UI catch-all "/". Matching the
          # host puts the /spark-history location in the same server block.
          kubectl patch ingress orchestration-spark-history-ingress -n {{ .Release.Namespace }} --type json -p "[{\"op\":\"replace\",\"path\":\"/spec/rules/0/host\",\"value\":\"$LOAD_BALANCER_ADDRESS\"}]" 2>/dev/null || kubectl patch ingress orchestration-spark-history-ingress -n {{ .Release.Namespace }} --type json -p "[{\"op\":\"add\",\"path\":\"/spec/rules/0/host\",\"value\":\"$LOAD_BALANCER_ADDRESS\"}]"
          # Spark History Server public URL: domain-less installs can't derive it
          # from a domain (historyServerPublicUrl helper renders empty), so the hub's
          # job-UI proxy returns SHS_NOT_CONFIGURED. Point it at the LB spark-history
          # route, mirroring the hub/UI patches above.
          kubectl set env deployment/zipline-orchestration-hub CRUCIBLE_SPARK_HISTORY_PUBLIC_URL=http://$LOAD_BALANCER_ADDRESS{{ include "zipline-orchestration.historyServerProxyBase" . }} -n {{ .Release.Namespace }}
{{- end }}
