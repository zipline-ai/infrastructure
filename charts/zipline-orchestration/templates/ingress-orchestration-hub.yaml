apiVersion: networking.k8s.io/v1
kind: Ingress
{{- $hubPath := default "/" (trimSuffix "/" (.Values.ingress.hub.path | default "/")) }}
metadata:
  name: orchestration-hub-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- with .Values.ingress.hub.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- $ba := .Values.ingress.hub.browserAuth }}
    {{- if $ba.enabled }}
    # Browser forward-auth: nginx subrequest mints a JWT from the better-auth
    # session cookie via the UI; CLI traffic with Authorization: Bearer is
    # unchanged (the forward endpoint echoes the header through).
    {{- $defaultForward := printf "http://orchestration-ui-service.%s.svc.cluster.local/auth/forward" .Release.Namespace }}
    nginx.ingress.kubernetes.io/auth-url: {{ default $defaultForward $ba.forwardUrl | quote }}
    nginx.ingress.kubernetes.io/auth-method: "GET"
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization"
    nginx.ingress.kubernetes.io/auth-signin: {{ default "https://$host/auth/login?redirect=$escaped_request_uri" $ba.signinUrl | quote }}
    nginx.ingress.kubernetes.io/auth-cache-key: {{ default "$http_authorization|$cookie_better_auth_session_token" $ba.cacheKey | quote }}
    nginx.ingress.kubernetes.io/auth-cache-duration: {{ default "200 60s" $ba.cacheDuration | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.hub.className }}
  {{- with .Values.ingress.hub.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hub.host }}
    - host: {{ .Values.ingress.hub.host }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- if eq $hubPath "/" }}
          - path: /
            pathType: Prefix
          {{- else }}
          - path: {{ printf "%s(/|$)(.*)" $hubPath | quote }}
            pathType: ImplementationSpecific
          {{- end }}
            backend:
              service:
                name: orchestration-hub-service
                port:
                  number: 80
