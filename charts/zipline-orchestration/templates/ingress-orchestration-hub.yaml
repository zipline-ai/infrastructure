apiVersion: networking.k8s.io/v1
kind: Ingress
{{- $hubPath := default "/" (trimSuffix "/" (.Values.ingress.hub.path | default "/")) }}
metadata:
  name: orchestration-hub-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- with .Values.ingress.hub.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    # Browser forward-auth: nginx subrequest to UI's /auth/forward mints a JWT
    # from the better-auth session cookie; CLI traffic with Authorization:
    # Bearer is unchanged (the forward endpoint echoes the header through).
    nginx.ingress.kubernetes.io/auth-url: {{ .Values.ingress.hub.browserAuth.forwardUrl | quote }}
    nginx.ingress.kubernetes.io/auth-method: "GET"
    nginx.ingress.kubernetes.io/auth-response-headers: "Authorization"
    nginx.ingress.kubernetes.io/auth-signin: {{ .Values.ingress.hub.browserAuth.signinUrl | quote }}
    nginx.ingress.kubernetes.io/auth-cache-key: {{ .Values.ingress.hub.browserAuth.cacheKey | quote }}
    nginx.ingress.kubernetes.io/auth-cache-duration: {{ .Values.ingress.hub.browserAuth.cacheDuration | quote }}
spec:
  ingressClassName: {{ .Values.ingress.hub.className }}
  {{- with .Values.ingress.hub.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.hub.host }}
    - host: {{ .Values.ingress.hub.host }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- if eq $hubPath "/" }}
          - path: /
            pathType: Prefix
          {{- else }}
          - path: {{ printf "%s(/|$)(.*)" $hubPath | quote }}
            pathType: ImplementationSpecific
          {{- end }}
            backend:
              service:
                name: orchestration-hub-service
                port:
                  number: 80
