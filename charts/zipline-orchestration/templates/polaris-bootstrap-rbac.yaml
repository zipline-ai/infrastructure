{{- $runtimeClient := default dict .Values.polaris.bootstrap.runtimeClient -}}
{{- $credentialsSecret := default dict $runtimeClient.credentialsSecret -}}
{{- $secretName := default "polaris-client-credentials" $credentialsSecret.name -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-runtime-client-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app: polaris
    app.kubernetes.io/component: polaris-bootstrap
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $secretName | quote }}]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["zipline-orchestration-hub"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polaris-runtime-client-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app: polaris
    app.kubernetes.io/component: polaris-bootstrap
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "zipline-orchestration.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polaris-runtime-client-bootstrap
