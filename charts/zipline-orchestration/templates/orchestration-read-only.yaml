{{- if .Values.orchestration.readOnly.enabled }}
{{- $reader := .Values.orchestration.readOnly }}
{{- $host := required "orchestration.readOnly.databaseHost is required" $reader.databaseHost }}
{{- $verticle := required "orchestration.readOnly.verticleClass is required" $reader.verticleClass }}
{{- $jdbcUrl := printf "jdbc:postgresql://%s:%v/%s" $host .Values.database.port .Values.database.name }}
{{- if .Values.database.sslMode }}
{{- $jdbcUrl = printf "%s?sslmode=%s" $jdbcUrl .Values.database.sslMode }}
{{- end }}
{{- if contains "," $verticle }}
{{- fail "orchestration.readOnly.verticleClass must select only the HTTP verticle, without workers" }}
{{- end }}
{{- if eq $host .Values.database.host }}
{{- fail "orchestration.readOnly.databaseHost must differ from the primary database host" }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestration-read-only-sa
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipline-orchestration-read-only
  namespace: {{ .Release.Namespace }}
  labels:
    app: orchestration-read-only
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ $reader.replicas }}
  selector:
    matchLabels:
      app: orchestration-read-only
  template:
    metadata:
      labels:
        app: orchestration-read-only
    spec:
      serviceAccountName: orchestration-read-only-sa
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: orchestration-read-only
          image: "{{ required "orchestration.hub.image is required" .Values.orchestration.hub.image }}:{{ include "zipline-orchestration.spark4Version" . }}"
          imagePullPolicy: Always
          env:
            - name: ORCHESTRATION_READ_ONLY
              value: "true"
            - name: VERTICLE_CLASS
              value: {{ $verticle | quote }}
            - name: ORCHESTRATION_PORT
              value: {{ .Values.orchestration.hub.port | quote }}
            - name: CUSTOMER_ID
              value: {{ .Values.global.customer_name | quote }}
            - name: DB_URL
              value: {{ $jdbcUrl | quote }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "zipline-orchestration.databaseCredentialsSecretName" . }}
                  key: {{ include "zipline-orchestration.databaseCredentialsUsernameKey" . }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "zipline-orchestration.databaseCredentialsSecretName" . }}
                  key: {{ include "zipline-orchestration.databaseCredentialsPasswordKey" . }}
            - name: AUTH_ENABLED
              value: {{ .Values.auth.enabled | quote }}
            - name: AUTH_JWKS_URL
              value: "http://orchestration-ui-service/api/auth/jwks"
          ports:
            - name: http
              containerPort: {{ .Values.orchestration.hub.port }}
          resources:
            {{- toYaml $reader.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: orchestration-read-only-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  selector:
    app: orchestration-read-only
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
{{- if $reader.ingress.enabled }}
{{- $readerHost := required "orchestration.readOnly.ingress.host is required when ingress is enabled" $reader.ingress.host }}
{{- if eq $readerHost .Values.ingress.hub.host }}
{{- fail "The read-only ingress must have a different hostname from the primary hub" }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestration-read-only-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
  {{- with $reader.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.hub.className }}
  {{- with $reader.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ $readerHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestration-read-only-service
                port:
                  number: 80
{{- end }}
{{- end }}
