{{- $polaris := .Values.polaris -}}
{{- $realm := default .Values.global.customer_name $polaris.realm -}}
{{- if not $realm -}}
{{- fail "global.customer_name or polaris.realm is required" -}}
{{- end -}}
{{- $rbacCatalog := default dict $polaris.bootstrap.rbac.catalog -}}
{{- $defaultCatalogName := printf "polaris_%s" $realm -}}
{{- $catalogName := default $defaultCatalogName $rbacCatalog.name -}}
{{- $objectStoreBucket := trimSuffix "/" (default "" .Values.compute.objectStore.bucket) -}}
{{- $objectStoreLocation := "" -}}
{{- if $objectStoreBucket -}}
{{- $objectStoreLocation = printf "%s/" $objectStoreBucket -}}
{{- end -}}
{{- $derivedBaseLocation := "" -}}
{{- if $objectStoreBucket -}}
{{- $derivedBaseLocation = printf "%s/polaris/%s/" $objectStoreBucket $catalogName -}}
{{- end -}}
{{- $catalogDefaultBaseLocation := default $derivedBaseLocation $rbacCatalog.defaultBaseLocation -}}
{{- $rbacStorage := default dict $rbacCatalog.storage -}}
{{- $storageType := required "polaris.bootstrap.rbac.catalog.storage.type is required" $rbacStorage.type -}}
{{- $storageConfig := deepCopy (default dict $rbacStorage.config) -}}
{{- $allowedLocations := default (list) $rbacStorage.allowedLocations -}}
{{- if and (eq (len $allowedLocations) 0) $catalogDefaultBaseLocation -}}
{{- $allowedLocations = list $catalogDefaultBaseLocation -}}
{{- end -}}
{{- $bootstrapCredentialsSecretName := default "polaris-bootstrap-credentials" $polaris.bootstrap.credentialsSecret.name -}}
{{- $bootstrapCredentialsSecretKey := default "credentials" $polaris.bootstrap.credentialsSecret.key -}}
{{- $runtimeClient := default dict $polaris.bootstrap.runtimeClient -}}
{{- $runtimeClientPrincipal := default "chronon" $runtimeClient.principal -}}
{{- $runtimeClientCredentialsSecret := default dict $runtimeClient.credentialsSecret -}}
{{- $runtimeClientCredentialsSecretName := default "polaris-client-credentials" $runtimeClientCredentialsSecret.name -}}
{{- $runtimeClientCredentialsSecretKey := default "OC_CREDENTIAL" $runtimeClientCredentialsSecret.key -}}
{{- $polarisDatabaseCredentialsSecret := default dict $polaris.database.credentialsSecret -}}
{{- $polarisDatabaseCredentialsSecretName := default (include "zipline-orchestration.databaseCredentialsSecretName" .) (index $polarisDatabaseCredentialsSecret "name") -}}
{{- $polarisDatabaseCredentialsUsernameKey := default (include "zipline-orchestration.databaseCredentialsUsernameKey" .) (index $polarisDatabaseCredentialsSecret "usernameKey") -}}
{{- $polarisDatabaseCredentialsPasswordKey := default (include "zipline-orchestration.databaseCredentialsPasswordKey" .) (index $polarisDatabaseCredentialsSecret "passwordKey") -}}
{{- $existingBootstrapSecret := lookup "v1" "Secret" .Release.Namespace $bootstrapCredentialsSecretName -}}
{{- $existingBootstrapSecretData := dict -}}
{{- if $existingBootstrapSecret -}}
{{- $existingBootstrapSecretData = default dict $existingBootstrapSecret.data -}}
{{- end -}}
{{- $bootstrapCredentials := printf "%s,root,%s" $realm (randAlphaNum 48) | b64enc -}}
{{- if hasKey $existingBootstrapSecretData $bootstrapCredentialsSecretKey -}}
{{- $bootstrapCredentials = index $existingBootstrapSecretData $bootstrapCredentialsSecretKey -}}
{{- end -}}
{{- $existingRuntimeClientSecret := lookup "v1" "Secret" .Release.Namespace $runtimeClientCredentialsSecretName -}}
{{- $existingRuntimeClientSecretData := dict -}}
{{- if $existingRuntimeClientSecret -}}
{{- $existingRuntimeClientSecretData = default dict $existingRuntimeClientSecret.data -}}
{{- end -}}
{{- $runtimeClientCredentials := printf "%s:%s" $runtimeClientPrincipal (randAlphaNum 48) | b64enc -}}
{{- if hasKey $existingRuntimeClientSecretData $runtimeClientCredentialsSecretKey -}}
{{- $runtimeClientCredentials = index $existingRuntimeClientSecretData $runtimeClientCredentialsSecretKey -}}
{{- end -}}
{{- $databaseName := required "polaris.database.name is required" $polaris.database.name -}}
{{- $databaseHost := required "database.host is required" .Values.database.host -}}
{{- $databaseAddress := printf "%s:%v" $databaseHost (.Values.database.port | default 5432) -}}
{{- $jdbcUrl := printf "jdbc:postgresql://%s/%s%s" $databaseAddress $databaseName $polaris.database.jdbcParams -}}
{{- $psqlAdminUrl := printf "postgresql://%s/%s%s" $databaseAddress $polaris.database.adminDatabase $polaris.database.psqlParams -}}
{{- $psqlPolarisUrl := printf "postgresql://%s/%s%s" $databaseAddress $databaseName $polaris.database.psqlParams -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $bootstrapCredentialsSecretName | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: polaris
    app.kubernetes.io/component: polaris-bootstrap
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $bootstrapCredentialsSecretKey }}: {{ $bootstrapCredentials | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $runtimeClientCredentialsSecretName | quote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/resource-policy": keep
  labels:
    app: polaris
    app.kubernetes.io/component: polaris-runtime-client
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $runtimeClientCredentialsSecretKey }}: {{ $runtimeClientCredentials | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: polaris-config
  namespace: {{ .Release.Namespace }}
  labels:
    app: polaris
    app.kubernetes.io/component: polaris
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
data:
  application.properties: |-
    quarkus.http.port={{ $polaris.ports.http }}
    quarkus.management.port={{ $polaris.ports.management }}
    quarkus.log.file.enabled=false
    quarkus.otel.sdk.disabled=true
    polaris.persistence.type=relational-jdbc
    polaris.realm-context.type=default
    polaris.realm-context.realms={{ $realm }}
    polaris.realm-context.require-header={{ $polaris.realmContext.requireHeader }}
    {{- range $key, $value := $polaris.extraConfig }}
    {{ $key }}={{ $value }}
    {{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: polaris-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    app: polaris
    app.kubernetes.io/component: polaris-bootstrap
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ $polaris.bootstrap.backoffLimit }}
  activeDeadlineSeconds: {{ $polaris.bootstrap.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app: polaris
        app.kubernetes.io/component: polaris-bootstrap
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "zipline-orchestration.serviceAccountName" . }}
      {{- if hasKey $polaris "imagePullSecrets" }}
      {{- with $polaris.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with $polaris.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $polaris.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-polaris-bootstrap
          image: {{ $polaris.database.initImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsUsernameKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsPasswordKey }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsUsernameKey }}
            - name: POLARIS_DB_NAME
              value: {{ $databaseName | quote }}
            - name: PG_ADMIN_URL
              value: {{ $psqlAdminUrl | quote }}
            - name: PG_POLARIS_URL
              value: {{ $psqlPolarisUrl | quote }}
            - name: POLARIS_RUNTIME_CLIENT_SECRET_KEY
              value: {{ $runtimeClientCredentialsSecretKey | quote }}
            - name: POLARIS_RUNTIME_CLIENT_PRINCIPAL
              value: {{ $runtimeClientPrincipal | quote }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              credential="$(cat /etc/polaris-bootstrap/credentials)"
              realm="${credential%%,*}"
              remaining="${credential#*,}"
              client_id="${remaining%%,*}"
              if [ "$remaining" = "$credential" ] || [ "$client_id" = "$remaining" ] || [ -z "$realm" ] || [ -z "$client_id" ]; then
                echo "Invalid Polaris bootstrap credential format" >&2
                exit 1
              fi
              case "$realm" in (*[!A-Za-z0-9_.-]*|"") echo "Invalid Polaris realm: $realm" >&2; exit 1;; esac
              case "$client_id" in (*[!A-Za-z0-9_.-]*|"") echo "Invalid Polaris client id: $client_id" >&2; exit 1;; esac
              {{- if $polaris.database.create }}
              case "$POLARIS_DB_NAME" in (*[!A-Za-z0-9_]*|"") echo "Invalid database name: $POLARIS_DB_NAME" >&2; exit 1;; esac
              case "$DB_USERNAME" in (*[!A-Za-z0-9_]*|"") echo "Invalid database owner: $DB_USERNAME" >&2; exit 1;; esac
              if psql "$PG_ADMIN_URL" --set=ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = '$POLARIS_DB_NAME'" | grep -q 1; then
                echo "Database $POLARIS_DB_NAME already exists"
              else
                psql "$PG_ADMIN_URL" --set=ON_ERROR_STOP=1 -c "CREATE DATABASE \"$POLARIS_DB_NAME\" OWNER \"$DB_USERNAME\""
              fi
              {{- end }}
              if psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -tAc "SELECT 1 FROM information_schema.tables WHERE table_schema = 'polaris_schema' AND table_name = 'principal_authentication_data'" | grep -q 1; then
                reconcile_auth_row() {
                  row_realm="$1"
                  row_client_id="$2"
                  row_client_secret="$3"
                  case "$row_realm" in (*[!A-Za-z0-9_.-]*|"") echo "Invalid Polaris realm: $row_realm" >&2; exit 1;; esac
                  case "$row_client_id" in (*[!A-Za-z0-9_.-]*|"") echo "Invalid Polaris client id: $row_client_id" >&2; exit 1;; esac
                  salt="$(psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -tAc "SELECT secret_salt FROM polaris_schema.principal_authentication_data WHERE realm_id = '$row_realm' AND principal_client_id = '$row_client_id';")"
                  if [ -z "$salt" ]; then
                    return 0
                  fi
                  tmp="$(mktemp)"
                  printf "%s:%s" "$row_client_secret" "$salt" > "$tmp"
                  hash_line="$(sha256sum "$tmp")"
                  rm -f "$tmp"
                  hash="${hash_line%% *}"
                  psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -q -c "UPDATE polaris_schema.principal_authentication_data SET main_secret_hash = '$hash', secondary_secret_hash = '$hash' WHERE realm_id = '$row_realm' AND principal_client_id = '$row_client_id';"
                  echo "Reconciled Polaris auth row for realm=$row_realm client=$row_client_id"
                }
                reconcile_principal_auth_row() {
                  row_realm="$1"
                  row_principal_name="$2"
                  row_client_id="$3"
                  row_client_secret="$4"
                  case "$row_realm" in (*[!A-Za-z0-9_.-]*|"") echo "Invalid Polaris realm: $row_realm" >&2; exit 1;; esac
                  case "$row_principal_name" in (*[!A-Za-z0-9_.-]*|"") echo "Invalid Polaris principal: $row_principal_name" >&2; exit 1;; esac
                  case "$row_client_id" in (*[!A-Za-z0-9_.-]*|"") echo "Invalid Polaris client id: $row_client_id" >&2; exit 1;; esac
                  principal_id="$(psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -tAc "SELECT id FROM polaris_schema.entities WHERE realm_id = '$row_realm' AND name = '$row_principal_name';")"
                  case "$principal_id" in (*[!0-9]*|"") return 0;; esac
                  salt="$(psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -tAc "SELECT secret_salt FROM polaris_schema.principal_authentication_data WHERE realm_id = '$row_realm' AND principal_id = $principal_id;")"
                  if [ -z "$salt" ]; then
                    return 0
                  fi
                  tmp="$(mktemp)"
                  printf "%s:%s" "$row_client_secret" "$salt" > "$tmp"
                  hash_line="$(sha256sum "$tmp")"
                  rm -f "$tmp"
                  hash="${hash_line%% *}"
                  psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -q -c "UPDATE polaris_schema.principal_authentication_data SET principal_client_id = '$row_client_id', main_secret_hash = '$hash', secondary_secret_hash = '$hash' WHERE realm_id = '$row_realm' AND principal_id = $principal_id;"
                  psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -q -c "UPDATE polaris_schema.entities SET internal_properties = jsonb_set(internal_properties, '{client_id}', to_jsonb('$row_client_id'::text), true) WHERE realm_id = '$row_realm' AND id = $principal_id;"
                  echo "Reconciled Polaris auth row for realm=$row_realm principal=$row_principal_name client=$row_client_id"
                }
                if psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -tAc "SELECT 1 FROM polaris_schema.principal_authentication_data WHERE realm_id = '$realm' AND principal_client_id = '$client_id'" | grep -q 1; then
                  client_secret="${remaining#*,}"
                  reconcile_auth_row "$realm" "$client_id" "$client_secret"
                  echo "Polaris root principal $client_id already exists in realm $realm; skipping bootstrap"
                  touch /bootstrap-state/skip-bootstrap
                fi
                runtime_credential="$(cat "/etc/polaris-runtime-client/$POLARIS_RUNTIME_CLIENT_SECRET_KEY")"
                runtime_client_id="${runtime_credential%%:*}"
                runtime_client_secret="${runtime_credential#*:}"
                if [ "$runtime_client_id" != "$runtime_credential" ] && [ -n "$runtime_client_id" ] && [ -n "$runtime_client_secret" ] && psql "$PG_POLARIS_URL" --set=ON_ERROR_STOP=1 -tAc "SELECT 1 FROM polaris_schema.principal_authentication_data WHERE realm_id = '$realm' AND principal_client_id = '$runtime_client_id'" | grep -q 1; then
                  reconcile_auth_row "$realm" "$runtime_client_id" "$runtime_client_secret"
                elif [ "$runtime_client_id" != "$runtime_credential" ] && [ -n "$runtime_client_id" ] && [ -n "$runtime_client_secret" ]; then
                  reconcile_principal_auth_row "$realm" "$POLARIS_RUNTIME_CLIENT_PRINCIPAL" "$runtime_client_id" "$runtime_client_secret"
                fi
              fi
          volumeMounts:
            - name: polaris-bootstrap-credentials
              mountPath: /etc/polaris-bootstrap
              readOnly: true
            - name: polaris-runtime-client-credentials
              mountPath: /etc/polaris-runtime-client
              readOnly: true
            - name: bootstrap-state
              mountPath: /bootstrap-state
      containers:
        - name: bootstrap-polaris
          image: "{{ $polaris.bootstrap.image.repository }}:{{ default $polaris.image.tag $polaris.bootstrap.image.tag }}"
          imagePullPolicy: {{ default $polaris.image.pullPolicy $polaris.bootstrap.image.pullPolicy }}
          env:
            - name: POLARIS_PERSISTENCE_TYPE
              value: relational-jdbc
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsUsernameKey }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsPasswordKey }}
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ $jdbcUrl | quote }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              if [ -f /bootstrap-state/skip-bootstrap ]; then
                echo "Polaris already bootstrapped; skipping"
                exit 0
              fi
              credential="$(cat /etc/polaris-bootstrap/credentials)"
              realm="${credential%%,*}"
              exec java -jar /deployments/polaris-admin-tool.jar bootstrap -r "$realm" -c "$credential"
          volumeMounts:
            - name: polaris-bootstrap-credentials
              mountPath: /etc/polaris-bootstrap
              readOnly: true
            - name: bootstrap-state
              mountPath: /bootstrap-state
          resources:
{{- toYaml $polaris.bootstrap.resources | nindent 12 }}
        - name: configure-polaris-rbac
          image: "{{ $polaris.bootstrap.rbac.image.repository }}:{{ $polaris.bootstrap.rbac.image.tag }}"
          imagePullPolicy: {{ $polaris.bootstrap.rbac.image.pullPolicy }}
          env:
            - name: POLARIS_BASE_URL
              value: {{ printf "http://polaris-service:%d" (int $polaris.ports.http) | quote }}
            - name: POLARIS_CATALOG_NAME
              value: {{ $catalogName | quote }}
            - name: POLARIS_CATALOG_DEFAULT_BASE_LOCATION
              value: {{ $catalogDefaultBaseLocation | quote }}
            - name: POLARIS_CATALOG_STORAGE_TYPE
              value: {{ $storageType | quote }}
            - name: POLARIS_CATALOG_STORAGE_CONFIG
              value: {{ toJson $storageConfig | quote }}
            - name: POLARIS_CATALOG_ALLOWED_LOCATIONS
              value: {{ toJson $allowedLocations | quote }}
            - name: POLARIS_PRINCIPAL_ROLE
              value: {{ $polaris.bootstrap.rbac.principalRole | quote }}
            - name: POLARIS_CATALOG_ROLE
              value: {{ $polaris.bootstrap.rbac.catalogRole | quote }}
            - name: POLARIS_CATALOG_GRANTS
              value: {{ toJson (default (list) $polaris.bootstrap.rbac.catalogGrants) | quote }}
            - name: POLARIS_NAMESPACES
              value: {{ toJson (default (list) $polaris.bootstrap.rbac.namespaces) | quote }}
            - name: POLARIS_RUNTIME_CLIENT_PRINCIPAL
              value: {{ $runtimeClientPrincipal | quote }}
            - name: POLARIS_RUNTIME_CLIENT_PRINCIPAL_ROLE
              value: {{ default "chronon-engine" $runtimeClient.principalRole | quote }}
            - name: POLARIS_RUNTIME_CLIENT_CATALOG_ROLE
              value: {{ default $polaris.bootstrap.rbac.catalogRole $runtimeClient.catalogRole | quote }}
            - name: POLARIS_RUNTIME_CLIENT_SECRET_NAME
              value: {{ $runtimeClientCredentialsSecretName | quote }}
            - name: POLARIS_RUNTIME_CLIENT_SECRET_KEY
              value: {{ $runtimeClientCredentialsSecretKey | quote }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              python - <<'PY'
              import base64
              import json
              import os
              import ssl
              import sys
              import time
              import urllib.error
              import urllib.parse
              import urllib.request

              def load_json_env(name, default):
                  raw = os.getenv(name, "")
                  if not raw:
                      return default
                  return json.loads(raw)

              def quote_path(value):
                  return urllib.parse.quote(value, safe="")

              def namespace_parts(namespace):
                  if isinstance(namespace, list):
                      return namespace
                  return [part for part in str(namespace).split(".") if part]

              def catalog_storage_config(default_base_location, existing=None):
                  storage = dict(existing or {})
                  storage.update(load_json_env("POLARIS_CATALOG_STORAGE_CONFIG", {}))
                  storage["storageType"] = os.environ["POLARIS_CATALOG_STORAGE_TYPE"]
                  allowed_locations = load_json_env("POLARIS_CATALOG_ALLOWED_LOCATIONS", [])
                  if allowed_locations:
                      storage["allowedLocations"] = allowed_locations
                  elif default_base_location and not storage.get("allowedLocations"):
                      storage["allowedLocations"] = [default_base_location]
                  return storage

              def is_duplicate_write_error(payload):
                  return "duplicate key value violates unique constraint" in payload

              def http_json(
                  method,
                  url,
                  token=None,
                  body=None,
                  ok=(200,),
                  retry_conflict=False,
                  retry_not_found=False,
                  content_type="application/json",
              ):
                  data = None
                  headers = {"Polaris-Realm": realm, "realm": realm}
                  if token:
                      headers["Authorization"] = f"Bearer {token}"
                  if body is not None:
                      data = json.dumps(body).encode("utf-8")
                      headers["Content-Type"] = content_type
                  request = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = response.read().decode("utf-8")
                          if response.status not in ok:
                              raise RuntimeError(f"{method} {url} returned {response.status}: {payload}")
                          return response.status, json.loads(payload) if payload else None
                  except urllib.error.HTTPError as error:
                      payload = error.read().decode("utf-8", "replace")
                      if error.code == 409 and retry_conflict:
                          return error.code, None
                      if error.code == 500 and retry_conflict and is_duplicate_write_error(payload):
                          return error.code, None
                      if error.code == 404 and retry_not_found:
                          return error.code, None
                      raise RuntimeError(f"{method} {url} returned {error.code}: {payload}") from error

              def try_http_json(method, url, token=None, body=None, ok=(200,), retry_conflict=False):
                  data = None
                  headers = {"Polaris-Realm": realm, "realm": realm}
                  if token:
                      headers["Authorization"] = f"Bearer {token}"
                  if body is not None:
                      data = json.dumps(body).encode("utf-8")
                      headers["Content-Type"] = "application/json"
                  request = urllib.request.Request(url, data=data, headers=headers, method=method)
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = response.read().decode("utf-8")
                          if response.status not in ok:
                              return False, response.status, None, payload
                          return True, response.status, json.loads(payload) if payload else None, ""
                  except urllib.error.HTTPError as error:
                      payload = error.read().decode("utf-8", "replace")
                      if error.code == 409 and retry_conflict:
                          return True, error.code, None, payload
                      if error.code == 500 and retry_conflict and is_duplicate_write_error(payload):
                          return True, error.code, None, payload
                      return False, error.code, None, payload
                  except Exception as error:
                      return False, None, None, str(error)

              def first_present(*values):
                  for value in values:
                      if value:
                          return value
                  return None

              def extract_credentials(payload, fallback_client_id=None):
                  payload = payload or {}
                  containers = [
                      payload,
                      payload.get("credentials") or {},
                      payload.get("credential") or {},
                      payload.get("principalCredentials") or {},
                      payload.get("principalCredential") or {},
                      payload.get("principal") or {},
                  ]
                  client_id = fallback_client_id
                  client_secret = None
                  for item in containers:
                      if not isinstance(item, dict):
                          continue
                      client_id = first_present(
                          item.get("clientId"),
                          item.get("client_id"),
                          item.get("principalClientId"),
                          item.get("principal_client_id"),
                          client_id,
                      )
                      client_secret = first_present(
                          item.get("clientSecret"),
                          item.get("client_secret"),
                          item.get("principalClientSecret"),
                          item.get("principal_client_secret"),
                          item.get("secret"),
                          client_secret,
                      )
                  if client_id and client_secret:
                      return f"{client_id}:{client_secret}"
                  return None

              def ensure_principal_role(role_name):
                  role_url = f"{management_api_url}/principal-roles/{quote_path(role_name)}"
                  status, _ = http_json("GET", role_url, token=token, ok=(200,), retry_not_found=True)
                  if status == 404:
                      http_json(
                          "POST",
                          f"{management_api_url}/principal-roles",
                          token=token,
                          body={"principalRole": {"name": role_name}},
                          ok=(200, 201),
                          retry_conflict=True,
                      )

              def grant_catalog_role_to_principal_role(role_name, role_catalog_name, role_catalog_role):
                  http_json(
                      "PUT",
                      f"{management_api_url}/principal-roles/{quote_path(role_name)}/catalog-roles/{quote_path(role_catalog_name)}",
                      token=token,
                      body={"catalogRole": {"name": role_catalog_role}},
                      ok=(200, 201, 204),
                      retry_conflict=True,
                  )

              def read_kubernetes_secret_credential(secret_name, secret_key):
                  status, payload = kubernetes_json(
                      "GET",
                      f"/api/v1/namespaces/{quote_path(kubernetes_namespace)}/secrets/{quote_path(secret_name)}",
                      ok=(200,),
                      retry_not_found=True,
                  )
                  if status == 404:
                      return None
                  data = (payload or {}).get("data") or {}
                  encoded = data.get(secret_key)
                  if not encoded:
                      return None
                  return base64.b64decode(encoded).decode("utf-8")

              def rotate_principal_credentials(principal_name):
                  errors = []
                  for method, path, body in [
                      ("POST", f"/principals/{quote_path(principal_name)}/credentials", {}),
                      ("POST", f"/principals/{quote_path(principal_name)}/rotate-credentials", {}),
                      ("POST", f"/principals/{quote_path(principal_name)}/reset-credentials", {}),
                      ("PUT", f"/principals/{quote_path(principal_name)}/credentials", {}),
                  ]:
                      ok_status, status, payload, error = try_http_json(
                          method,
                          f"{management_api_url}{path}",
                          token=token,
                          body=body,
                          ok=(200, 201),
                      )
                      if ok_status:
                          credential = extract_credentials(payload, fallback_client_id=principal_name)
                          if credential:
                              return credential
                      errors.append(f"{method} {path} -> {status}: {error}")
                  raise RuntimeError(
                      "Polaris principal already exists but no Kubernetes credential secret was found, "
                      f"and credential rotation did not succeed: {'; '.join(errors)}"
                  )

              def ensure_principal(principal_name, secret_name, secret_key):
                  principal_url = f"{management_api_url}/principals/{quote_path(principal_name)}"
                  status, _ = http_json("GET", principal_url, token=token, ok=(200,), retry_not_found=True)
                  if status != 404:
                      existing_credential = read_kubernetes_secret_credential(secret_name, secret_key)
                      if existing_credential:
                          return existing_credential
                      return rotate_principal_credentials(principal_name)

                  errors = []
                  for body in [
                      {"principal": {"name": principal_name}},
                      {"principal": {"name": principal_name, "type": "SERVICE"}},
                  ]:
                      ok_status, post_status, payload, error = try_http_json(
                          "POST",
                          f"{management_api_url}/principals",
                          token=token,
                          body=body,
                          ok=(200, 201),
                          retry_conflict=True,
                      )
                      if ok_status and post_status in (200, 201):
                          credential = extract_credentials(payload, fallback_client_id=principal_name)
                          if credential:
                              return credential
                          errors.append("POST /principals succeeded but did not return client credentials")
                      elif ok_status:
                          return rotate_principal_credentials(principal_name)
                      else:
                          errors.append(f"POST /principals -> {post_status}: {error}")
                  raise RuntimeError(f"Failed to create Polaris runtime principal {principal_name}: {'; '.join(errors)}")

              def assign_principal_role(principal_name, role_name):
                  attempts = [
                      (
                          "PUT",
                          f"/principal-roles/{quote_path(role_name)}/principals",
                          {"principal": {"name": principal_name}},
                      ),
                      (
                          "POST",
                          f"/principal-roles/{quote_path(role_name)}/principals",
                          {"principal": {"name": principal_name}},
                      ),
                      (
                          "PUT",
                          f"/principals/{quote_path(principal_name)}/principal-roles",
                          {"principalRole": {"name": role_name}},
                      ),
                      (
                          "POST",
                          f"/principals/{quote_path(principal_name)}/principal-roles",
                          {"principalRole": {"name": role_name}},
                      ),
                  ]
                  errors = []
                  for method, path, body in attempts:
                      ok_status, status, _, error = try_http_json(
                          method,
                          f"{management_api_url}{path}",
                          token=token,
                          body=body,
                          ok=(200, 201, 204),
                          retry_conflict=True,
                      )
                      if ok_status:
                          return
                      errors.append(f"{method} {path} -> {status}: {error}")
                  raise RuntimeError(
                      f"Failed to assign Polaris principal {principal_name} to principal role {role_name}: "
                      + "; ".join(errors)
                  )

              def kubernetes_json(method, path, body=None, ok=(200,), retry_not_found=False, content_type="application/json"):
                  with open("/var/run/secrets/kubernetes.io/serviceaccount/token", encoding="utf-8") as token_file:
                      kubernetes_token = token_file.read().strip()
                  ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
                  host = os.environ["KUBERNETES_SERVICE_HOST"]
                  port = os.getenv("KUBERNETES_SERVICE_PORT_HTTPS", os.getenv("KUBERNETES_SERVICE_PORT", "443"))
                  data = None
                  headers = {"Authorization": f"Bearer {kubernetes_token}"}
                  if body is not None:
                      data = json.dumps(body).encode("utf-8")
                      headers["Content-Type"] = content_type
                  request = urllib.request.Request(f"https://{host}:{port}{path}", data=data, headers=headers, method=method)
                  context = ssl.create_default_context(cafile=ca_file)
                  try:
                      with urllib.request.urlopen(request, timeout=30, context=context) as response:
                          payload = response.read().decode("utf-8")
                          if response.status not in ok:
                              raise RuntimeError(f"{method} {path} returned {response.status}: {payload}")
                          return response.status, json.loads(payload) if payload else None
                  except urllib.error.HTTPError as error:
                      payload = error.read().decode("utf-8", "replace")
                      if error.code == 404 and retry_not_found:
                          return error.code, None
                      if error.code not in ok:
                          raise RuntimeError(f"{method} {path} returned {error.code}: {payload}") from error
                      return error.code, json.loads(payload) if payload else None

              def write_kubernetes_secret(secret_name, secret_key, credential_value):
                  encoded_credential = base64.b64encode(credential_value.encode("utf-8")).decode("ascii")
                  secret_path = f"/api/v1/namespaces/{quote_path(kubernetes_namespace)}/secrets/{quote_path(secret_name)}"
                  status, _ = kubernetes_json("GET", secret_path, ok=(200,), retry_not_found=True)
                  patch_body = {
                      "metadata": {
                          "labels": {
                              "app": "polaris",
                              "app.kubernetes.io/component": "polaris-runtime-client",
                          }
                      },
                      "data": {secret_key: encoded_credential},
                  }
                  if status == 404:
                      create_body = {
                          "apiVersion": "v1",
                          "kind": "Secret",
                          "metadata": {
                              "name": secret_name,
                              "namespace": kubernetes_namespace,
                              "annotations": {
                                  "helm.sh/resource-policy": "keep",
                              },
                              "labels": patch_body["metadata"]["labels"],
                          },
                          "type": "Opaque",
                          "data": patch_body["data"],
                      }
                      kubernetes_json(
                          "POST",
                          f"/api/v1/namespaces/{quote_path(kubernetes_namespace)}/secrets",
                          body=create_body,
                          ok=(200, 201),
                      )
                  else:
                      kubernetes_json(
                          "PATCH",
                          secret_path,
                          body=patch_body,
                          ok=(200,),
                          content_type="application/merge-patch+json",
                      )

              def restart_hub_deployment():
                  restarted_at = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())
                  kubernetes_json(
                      "PATCH",
                      f"/apis/apps/v1/namespaces/{quote_path(kubernetes_namespace)}/deployments/zipline-orchestration-hub",
                      body={
                          "spec": {
                              "template": {
                                  "metadata": {
                                      "annotations": {
                                          "zipline.ai/polaris-runtime-client-restarted-at": restarted_at,
                                      }
                                  }
                              }
                          }
                      },
                      ok=(200,),
                      content_type="application/merge-patch+json",
                  )

              with open("/etc/polaris-bootstrap/credentials", encoding="utf-8") as credentials_file:
                  credential_parts = credentials_file.read().strip().split(",", 2)
              if len(credential_parts) != 3:
                  raise SystemExit("Invalid Polaris bootstrap credential format")
              realm, client_id, client_secret = credential_parts

              base_url = os.environ["POLARIS_BASE_URL"].rstrip("/")
              catalog_api_url = f"{base_url}/api/catalog"
              management_api_url = f"{base_url}/api/management/v1"
              catalog_name = os.getenv("POLARIS_CATALOG_NAME") or f"polaris_{realm}"
              principal_role = os.environ["POLARIS_PRINCIPAL_ROLE"]
              catalog_role = os.environ["POLARIS_CATALOG_ROLE"]
              catalog_grants = load_json_env("POLARIS_CATALOG_GRANTS", [])
              namespaces = load_json_env("POLARIS_NAMESPACES", [])
              runtime_client_principal = os.environ["POLARIS_RUNTIME_CLIENT_PRINCIPAL"]
              runtime_client_principal_role = os.environ["POLARIS_RUNTIME_CLIENT_PRINCIPAL_ROLE"]
              runtime_client_catalog_role = os.environ["POLARIS_RUNTIME_CLIENT_CATALOG_ROLE"]
              runtime_client_secret_name = os.environ["POLARIS_RUNTIME_CLIENT_SECRET_NAME"]
              runtime_client_secret_key = os.environ["POLARIS_RUNTIME_CLIENT_SECRET_KEY"]
              with open("/var/run/secrets/kubernetes.io/serviceaccount/namespace", encoding="utf-8") as namespace_file:
                  kubernetes_namespace = namespace_file.read().strip()

              token_url = f"{catalog_api_url}/v1/oauth/tokens"
              auth = base64.b64encode(f"{client_id}:{client_secret}".encode("utf-8")).decode("ascii")
              token_body = urllib.parse.urlencode(
                  {"grant_type": "client_credentials", "scope": "PRINCIPAL_ROLE:ALL"}
              ).encode("utf-8")
              token_headers = {
                  "Authorization": f"Basic {auth}",
                  "Content-Type": "application/x-www-form-urlencoded",
                  "Polaris-Realm": realm,
                  "realm": realm,
              }

              last_error = None
              token = None
              for attempt in range(60):
                  try:
                      request = urllib.request.Request(token_url, data=token_body, headers=token_headers, method="POST")
                      with urllib.request.urlopen(request, timeout=30) as response:
                          token = json.loads(response.read().decode("utf-8"))["access_token"]
                      break
                  except Exception as error:
                      last_error = error
                      time.sleep(5)
              if not token:
                  raise RuntimeError(f"Timed out waiting for Polaris token endpoint: {last_error}")

              catalog_url = f"{management_api_url}/catalogs/{quote_path(catalog_name)}"
              status, catalog = http_json("GET", catalog_url, token=token, ok=(200,), retry_not_found=True)
              default_base_location = os.getenv("POLARIS_CATALOG_DEFAULT_BASE_LOCATION", "")
              if status == 404:
                  if not default_base_location:
                      raise RuntimeError("polaris.bootstrap.rbac.catalog.defaultBaseLocation is required to create a catalog")
                  http_json(
                      "POST",
                      f"{management_api_url}/catalogs",
                      token=token,
                      body={
                          "catalog": {
                              "type": "INTERNAL",
                              "name": catalog_name,
                              "properties": {"default-base-location": default_base_location},
                              "storageConfigInfo": catalog_storage_config(default_base_location),
                          }
                      },
                      ok=(200, 201),
                      retry_conflict=True,
                  )
              else:
                  current_properties = catalog.get("properties") or {}
                  desired_properties = dict(current_properties)
                  if default_base_location:
                      desired_properties["default-base-location"] = default_base_location
                  current_storage = catalog.get("storageConfigInfo") or {}
                  desired_storage = catalog_storage_config(default_base_location, current_storage)
                  if desired_properties != current_properties or desired_storage != current_storage:
                      update_body = {
                          "properties": desired_properties,
                          "storageConfigInfo": desired_storage,
                      }
                      entity_version = catalog.get("entityVersion")
                      if entity_version is not None:
                          update_body["currentEntityVersion"] = entity_version
                      http_json(
                          "PUT",
                          catalog_url,
                          token=token,
                          body=update_body,
                          ok=(200,),
                      )

              principal_role_url = f"{management_api_url}/principal-roles/{quote_path(principal_role)}"
              status, _ = http_json("GET", principal_role_url, token=token, ok=(200,), retry_not_found=True)
              if status == 404:
                  http_json(
                      "POST",
                      f"{management_api_url}/principal-roles",
                      token=token,
                      body={"principalRole": {"name": principal_role}},
                      ok=(200, 201),
                      retry_conflict=True,
                  )

              catalog_role_url = (
                  f"{management_api_url}/catalogs/{quote_path(catalog_name)}/catalog-roles/{quote_path(catalog_role)}"
              )
              status, _ = http_json("GET", catalog_role_url, token=token, ok=(200,), retry_not_found=True)
              if status == 404:
                  http_json(
                      "POST",
                      f"{management_api_url}/catalogs/{quote_path(catalog_name)}/catalog-roles",
                      token=token,
                      body={"catalogRole": {"name": catalog_role}},
                      ok=(200, 201),
                      retry_conflict=True,
                  )

              http_json(
                  "PUT",
                  f"{management_api_url}/principal-roles/{quote_path(principal_role)}/catalog-roles/{quote_path(catalog_name)}",
                  token=token,
                  body={"catalogRole": {"name": catalog_role}},
                  ok=(200, 201, 204),
                  retry_conflict=True,
              )

              grants_url = (
                  f"{management_api_url}/catalogs/{quote_path(catalog_name)}/catalog-roles/{quote_path(catalog_role)}/grants"
              )
              for privilege in catalog_grants:
                  http_json(
                      "PUT",
                      grants_url,
                      token=token,
                      body={"grant": {"type": "catalog", "privilege": privilege}},
                      ok=(200, 201, 204),
                      retry_conflict=True,
                  )

              for namespace in namespaces:
                  namespace_name = namespace.get("name")
                  if not namespace_name:
                      continue
                  parts = namespace_parts(namespace_name)
                  if namespace.get("create", True):
                      http_json(
                          "POST",
                          f"{catalog_api_url}/v1/{quote_path(catalog_name)}/namespaces",
                          token=token,
                          body={"namespace": parts, "properties": {}},
                          ok=(200, 201, 204),
                          retry_conflict=True,
                      )
                  for privilege in namespace.get("grants", []):
                      http_json(
                          "PUT",
                          grants_url,
                          token=token,
                          body={"grant": {"type": "namespace", "namespace": parts, "privilege": privilege}},
                          ok=(200, 201, 204),
                          retry_conflict=True,
                      )

              ensure_principal_role(runtime_client_principal_role)
              grant_catalog_role_to_principal_role(
                  runtime_client_principal_role,
                  catalog_name,
                  runtime_client_catalog_role,
              )
              runtime_credential = ensure_principal(
                  runtime_client_principal,
                  runtime_client_secret_name,
                  runtime_client_secret_key,
              )
              assign_principal_role(runtime_client_principal, runtime_client_principal_role)
              write_kubernetes_secret(
                  runtime_client_secret_name,
                  runtime_client_secret_key,
                  runtime_credential,
              )
              restart_hub_deployment()

              print(f"Polaris RBAC reconciled for catalog {catalog_name}, principal role {principal_role}, catalog role {catalog_role}")
              PY
          volumeMounts:
            - name: polaris-bootstrap-credentials
              mountPath: /etc/polaris-bootstrap
              readOnly: true
          resources:
{{- toYaml $polaris.bootstrap.resources | nindent 12 }}
      volumes:
        - name: polaris-bootstrap-credentials
          secret:
            secretName: {{ $bootstrapCredentialsSecretName | quote }}
            items:
              - key: {{ $bootstrapCredentialsSecretKey | quote }}
                path: credentials
        - name: polaris-runtime-client-credentials
          secret:
            secretName: {{ $runtimeClientCredentialsSecretName | quote }}
            items:
              - key: {{ $runtimeClientCredentialsSecretKey | quote }}
                path: {{ $runtimeClientCredentialsSecretKey | quote }}
        - name: bootstrap-state
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipline-polaris
  namespace: {{ .Release.Namespace }}
  labels:
    app: polaris
    app.kubernetes.io/component: polaris
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ $polaris.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: polaris
  template:
    metadata:
      labels:
        app: polaris
        app.kubernetes.io/component: polaris
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "zipline-orchestration.serviceAccountName" . }}
      {{- if hasKey $polaris "imagePullSecrets" }}
      {{- with $polaris.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- else }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with $polaris.nodeSelector }}
      nodeSelector:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $polaris.tolerations }}
      tolerations:
      {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- if $polaris.database.create }}
      initContainers:
        - name: create-polaris-database
          image: {{ $polaris.database.initImage | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsUsernameKey }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsPasswordKey }}
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsUsernameKey }}
            - name: POLARIS_DB_NAME
              value: {{ $databaseName | quote }}
            - name: PG_ADMIN_URL
              value: {{ $psqlAdminUrl | quote }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              case "$POLARIS_DB_NAME" in (*[!A-Za-z0-9_]*|"") echo "Invalid database name: $POLARIS_DB_NAME" >&2; exit 1;; esac
              case "$DB_USERNAME" in (*[!A-Za-z0-9_]*|"") echo "Invalid database owner: $DB_USERNAME" >&2; exit 1;; esac
              if psql "$PG_ADMIN_URL" --set=ON_ERROR_STOP=1 -tAc "SELECT 1 FROM pg_database WHERE datname = '$POLARIS_DB_NAME'" | grep -q 1; then
                echo "Database $POLARIS_DB_NAME already exists"
              else
                psql "$PG_ADMIN_URL" --set=ON_ERROR_STOP=1 -c "CREATE DATABASE \"$POLARIS_DB_NAME\" OWNER \"$DB_USERNAME\""
              fi
      {{- end }}
      containers:
        - name: polaris
          image: "{{ $polaris.image.repository }}:{{ $polaris.image.tag }}"
          imagePullPolicy: {{ $polaris.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10000
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsUsernameKey }}
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $polarisDatabaseCredentialsSecretName }}
                  key: {{ $polarisDatabaseCredentialsPasswordKey }}
            - name: QUARKUS_DATASOURCE_JDBC_URL
              value: {{ $jdbcUrl | quote }}
            {{- with $polaris.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: polaris-config
              mountPath: /deployments/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
          ports:
            - name: http
              containerPort: {{ $polaris.ports.http }}
              protocol: TCP
            - name: management
              containerPort: {{ $polaris.ports.management }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: management
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: management
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
{{- toYaml $polaris.resources | nindent 12 }}
      volumes:
        - name: polaris-config
          configMap:
            name: polaris-config
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: polaris-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: polaris
    app.kubernetes.io/component: polaris
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  type: {{ $polaris.service.type }}
  selector:
    app: polaris
  ports:
    - name: http
      port: {{ $polaris.ports.http }}
      targetPort: http
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: polaris-management-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: polaris
    app.kubernetes.io/component: polaris
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  type: {{ $polaris.managementService.type }}
  {{- if $polaris.managementService.clusterIP }}
  clusterIP: {{ $polaris.managementService.clusterIP }}
  {{- end }}
  selector:
    app: polaris
  ports:
    - name: management
      port: {{ $polaris.ports.management }}
      targetPort: management
      protocol: TCP
