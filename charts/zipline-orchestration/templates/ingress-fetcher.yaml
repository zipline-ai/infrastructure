{{ if .Values.global.deploy_fetcher }}
apiVersion: networking.k8s.io/v1
kind: Ingress
{{- $fetcherPath := default "/" (trimSuffix "/" (.Values.ingress.fetcher.path | default "/")) }}
{{- $fetcherAnnotations := dict }}
{{- with .Values.ingress.fetcher.annotations }}
{{- $fetcherAnnotations = deepCopy . }}
{{- end }}
{{- if ne $fetcherPath "/" }}
{{- $_ := set $fetcherAnnotations "nginx.ingress.kubernetes.io/use-regex" "true" }}
{{- end }}
metadata:
  name: fetcher-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
  {{- with $fetcherAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.fetcher.className }}
  {{- with .Values.ingress.fetcher.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- if .Values.ingress.fetcher.host }}
    - host: {{ .Values.ingress.fetcher.host }}
      http:
    {{- else }}
    - http:
    {{- end }}
        paths:
          {{- if eq $fetcherPath "/" }}
          - path: /
            pathType: Prefix
          {{- else }}
          - path: {{ printf "%s(/|$)(.*)" $fetcherPath | quote }}
            pathType: ImplementationSpecific
          {{- end }}
            backend:
              service:
                name: fetcher-service
                port:
                  number: 80
{{ end }}
