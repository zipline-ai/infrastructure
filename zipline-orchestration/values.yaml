# Default values for zipline-orchestration
global:
  customer_name: ""
  region: "us-central1"
  project_id: ""
  artifact_prefix: ""
  version: ""

# Database configuration
database:
  temporal:
    host: ""
    username: ""
    password: ""
    database: ""
  orchestration:
    host: ""
    username: ""
    password: ""
    database: ""

# Bigtable configuration
bigtable:
  instance_id: ""
  table_partitions_dataset: ""

# Service account configuration
serviceAccount:
  temporal:
    googleServiceAccount: ""
  orchestration:
    googleServiceAccount: ""

# Domain configuration
domains:
  ziplineUI: ""  # If empty, will use nip.io
  temporal: ""   # If empty, will use nip.io
  hub: ""        # If empty, will use nip.io

# Static IP addresses (will be created by Terraform)
staticIPs:
  orchestrationUI: ""
  orchestrationUIName: ""
  temporalUI: ""
  temporalUIName: ""
  orchestrationHub: ""
  orchestrationHubName: ""

# Temporal configuration
temporal:
  server:
    image: "temporalio/auto-setup:1.28.0"
    replicas: 1
    resources:
      requests:
        cpu: "8000m"
        memory: "32Gi"
      limits:
        cpu: "2"
        memory: "4Gi"

  collector:
    image: "us-docker.pkg.dev/cloud-ops-agents-artifacts/cloud-run-gmp-sidecar/cloud-run-gmp-sidecar:1.2.0"
    resources:
      limits:
        memory: "1Gi"
        cpu: "1000m"

  web:
    image: "temporalio/ui:2.39.0"
    replicas: 1
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

# Orchestration services configuration
orchestration:
  worker:
    image: "ziplineai/orchestration-temporal-worker"
    replicas: 1
    resources:
      limits:
        cpu: "6"
        memory: "24Gi"

  hub:
    image: "ziplineai/orchestration-hub"
    replicas: 1
    port: 3903
    resources:
      limits:
        cpu: "8"
        memory: "32Gi"

  ui:
    image: "ziplineai/web-ui"
    replicas: 1
    port: 3000
    resources:
      limits:
        cpu: "1000m"
        memory: "1Gi"

# Ingress configuration
ingress:
  className: "gce"
  annotations:
    kubernetes.io/ingress.class: "gce"
    ingress.gcp.kubernetes.io/redirect-to-https: "true"