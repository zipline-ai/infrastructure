apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipline-temporal-web
  namespace: zipline-system
  labels:
    app: temporal-web
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.temporal.web.replicas }}
  selector:
    matchLabels:
      app: temporal-web
  template:
    metadata:
      labels:
        app: temporal-web
    spec:
      containers:
        - name: temporal-web
          image: {{ .Values.temporal.web.image }}
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: TEMPORAL_ADDRESS
              value: "temporal-service:7233"
          resources:
          {{- toYaml .Values.temporal.web.resources | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-web-service
  namespace: zipline-system
{{/*  annotations:*/}}
{{/*    cloud.google.com/backend-config: '{"default": "temporal-web-backendconfig"}'*/}}
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  selector:
    app: temporal-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
{{/*---*/}}
{{/*apiVersion: cloud.google.com/v1*/}}
{{/*kind: BackendConfig*/}}
{{/*metadata:*/}}
{{/*  name: temporal-web-backendconfig*/}}
{{/*  namespace: zipline-system*/}}
{{/*spec:*/}}
{{/*  iap:*/}}
{{/*    enabled: true*/}}
{{/*    oauthclientCredentials:*/}}
{{/*      secretName: iap-oauth-credentials*/}}