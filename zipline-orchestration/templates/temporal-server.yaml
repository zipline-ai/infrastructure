apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipline-temporal-server
  namespace: zipline-system
  labels:
    app: temporal-server
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.temporal.server.replicas }}
  selector:
    matchLabels:
      app: temporal-server
  template:
    metadata:
      labels:
        app: temporal-server
    spec:
      serviceAccountName: temporal-sa
      containers:
        - name: temporal-server
          image: {{ .Values.temporal.server.image }}
          env:
            - name: DB
              value: "postgres12"
            - name: DB_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: username
            - name: POSTGRES_PWD
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: password
            - name: POSTGRES_SEEDS
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: host
            - name: DBNAME
              valueFrom:
                secretKeyRef:
                  name: temporal-db-secret
                  key: database
            - name: SKIP_DEFAULT_NAMESPACE_CREATION
              value: "false"
            - name: SKIP_SCHEMA_SETUP
              value: "false"
            - name: POSTGRES_CONNECT_TIMEOUT
              value: "30"
            - name: LOG_LEVEL
              value: "debug"
            - name: PROMETHEUS_ENDPOINT
              value: "0.0.0.0:8080"
          ports:
            - containerPort: 7233
              name: grpc
            - containerPort: 8080
              name: http
          resources:
          {{- toYaml .Values.temporal.server.resources | nindent 10 }}
        - name: collector
          image: {{ .Values.temporal.collector.image }}
          resources:
          {{- toYaml .Values.temporal.collector.resources | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-service
  namespace: zipline-system
  labels:
    {{- include "zipline-orchestration.labels" . | nindent 4 }}
spec:
  selector:
    app: temporal-server
  ports:
    - name: grpc
      port: 7233
      targetPort: 7233
      protocol: TCP
  type: ClusterIP